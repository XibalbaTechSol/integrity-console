# integrity-console local stack: the operator dashboard and the user API with its own Postgres.
#
# The console is a client of integrity-core, not part of it. Start the core stack first
# (in integrity-core: `make up`), which serves the oracle on :8080 and BCC on :8000; this file
# reaches them through the host. Split from integrity-core's docker-compose.yml
# (integrity-core docs/EXECUTION_PLAN.md, A1).
services:
  dashboard:
    build:
      context: ./integrity-dashboard
      args:
        SOURCE_HASH: ${DASHBOARD_SOURCE_HASH:-unknown}
    environment:
      # Browser-facing URLs: the dashboard runs in the operator's browser, so these are the
      # host ports the core stack, Shield and Cortex publish.
      VITE_ORACLE_URL: http://localhost:8080
      VITE_BCC_MIDDLEWARE_URL: http://localhost:8000
      VITE_USERAPI_URL: http://localhost:8090
      VITE_SHIELD_BACKEND_URL: http://localhost:8435
      VITE_SHIELD_UI_URL: http://localhost:5193
      VITE_CORTEX_UI_URL: http://localhost:5190
      VITE_CHAIN_ID: "84532"
    ports: ["127.0.0.1:5173:5173"]

  # The user API's own Postgres: a separate trust domain from the oracle's database, by design
  # (integrity-core docs/INTERFACE_CONTRACT.md §6.10 and §13).
  userapi-postgres:
    image: postgres:16-alpine
    mem_limit: 384m
    cpus: 0.50
    environment:
      POSTGRES_DB: integrity_userapi
      POSTGRES_USER: integrity
      POSTGRES_PASSWORD: integrity_dev_only
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["userapi_pgdata:/var/lib/postgresql/data"]
    # The userapi test suite uses this instance on :5435; `docker compose up userapi-postgres`
    # before running it locally, or the tests fail with ConnectionRefusedError.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrity -d integrity_userapi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  userapi:
    build:
      context: ./integrity-userapi
      args:
        SOURCE_HASH: ${USERAPI_SOURCE_HASH:-unknown}
    depends_on:
      userapi-postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://integrity:integrity_dev_only@userapi-postgres:5432/integrity_userapi
      # The oracle runs in integrity-core's compose project, published on the host's :8080.
      ORACLE_URL: http://host.docker.internal:8080
      # Local UIs run over plain HTTP on 127.0.0.1. The service must omit the Secure cookie
      # attribute in this explicitly local profile or the browser never sends the HttpOnly
      # session back to /me/agents.
      USERAPI_INSECURE_COOKIES: "1"
    ports: ["127.0.0.1:8090:8090"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  userapi_pgdata:
